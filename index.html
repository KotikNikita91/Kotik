<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#9e8dc6">
  <title>Считаем деньгиииии</title>
  <link rel="manifest" href="manifest.json">
  <script>!function(){var t=localStorage.getItem('kotik_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}();</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="cat-icon.png">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div id="offlineBanner" class="offline-banner hidden"></div>

  <div class="app-container">

    <!-- Основная форма -->
    <div class="form-wrapper">
      <div class="form-top">
        <h1>Считаем деньгиииии</h1>
        <button type="button" id="themeToggle" class="theme-toggle" title="Сменить тему" aria-label="Сменить тему">
          <span id="themeIcon"></span>
        </button>
      </div>

      <div class="city-toggle">
        <span class="city-toggle__label">Город</span>
        <div class="city-seg" id="citySeg" role="group" aria-label="Выбор города">
          <button type="button" class="city-seg-btn active" data-city="">Тюмень</button>
          <button type="button" class="city-seg-btn" data-city="Мск">Мск</button>
        </div>
      </div>

      <form id="budgetForm">
        <div class="form-group">
          <label for="date">Дата</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label>Категория</label>
          <div class="category-grid" id="categoryGrid" role="group" aria-label="Выберите категорию">
            <button type="button" class="cat-btn" data-value="🛒 Продукты"><span class="cat-emoji">🛒</span><span class="cat-label">Продукты</span></button>
            <button type="button" class="cat-btn" data-value="🏥 Здоровье"><span class="cat-emoji">🏥</span><span class="cat-label">Здоровье</span></button>
            <button type="button" class="cat-btn" data-value="🏠 Дом"><span class="cat-emoji">🏠</span><span class="cat-label">Дом</span></button>
            <button type="button" class="cat-btn" data-value="🚗 Автомобиль"><span class="cat-emoji">🚗</span><span class="cat-label">Авто</span></button>
            <button type="button" class="cat-btn" data-value="🐱 Кот"><span class="cat-emoji">🐱</span><span class="cat-label">Кот</span></button>
            <button type="button" class="cat-btn" data-value="📱 Связь"><span class="cat-emoji">📱</span><span class="cat-label">Связь</span></button>
            <button type="button" class="cat-btn" data-value="👕 Одежда"><span class="cat-emoji">👕</span><span class="cat-label">Одежда</span></button>
            <button type="button" class="cat-btn" data-value="🍽️ Кафе/Рестораны"><span class="cat-emoji">🍽️</span><span class="cat-label">Кафе</span></button>
            <button type="button" class="cat-btn" data-value="🍱 Обед на работе"><span class="cat-emoji">🍱</span><span class="cat-label">Обед</span></button>
            <button type="button" class="cat-btn" data-value="🎮 Развлечения"><span class="cat-emoji">🎮</span><span class="cat-label">Развлечения</span></button>
            <button type="button" class="cat-btn" data-value="💄 Косметика"><span class="cat-emoji">💄</span><span class="cat-label">Косметика</span></button>
            <button type="button" class="cat-btn" data-value="💡 Коммуналка"><span class="cat-emoji">💡</span><span class="cat-label">ЖКХ</span></button>
            <button type="button" class="cat-btn" data-value="🏡 Ипотека"><span class="cat-emoji">🏡</span><span class="cat-label">Ипотека</span></button>
            <button type="button" class="cat-btn" data-value="🛏 Аренда"><span class="cat-emoji">🛏</span><span class="cat-label">Аренда</span></button>
            <button type="button" class="cat-btn" data-value="🚕 Такси/Общ. транспорт"><span class="cat-emoji">🚕</span><span class="cat-label">Такси</span></button>
            <button type="button" class="cat-btn" data-value="✈️ Авиа / ЖД билеты"><span class="cat-emoji">✈️</span><span class="cat-label">Авиа/ЖД</span></button>
            <button type="button" class="cat-btn" data-value="🌎 Отпуск"><span class="cat-emoji">🌎</span><span class="cat-label">Отпуск</span></button>
            <button type="button" class="cat-btn" data-value="❗ Непредвиденное"><span class="cat-emoji">❗</span><span class="cat-label">Прочее</span></button>
            <button type="button" class="cat-btn" data-value="🥊🏈⚽️ Спорт"><span class="cat-emoji">🥊</span><span class="cat-label">Спорт</span></button>
            <button type="button" class="cat-btn cat-btn--income" data-value="💰 Доход"><span class="cat-emoji">💰</span><span class="cat-label">Доход</span></button>
          </div>
          <input type="hidden" id="category" name="category">
        </div>

        <div class="form-group">
          <label for="sum">Сумма</label>
          <input type="text" inputmode="decimal" id="sum" name="sum" placeholder="Введите сумму" required>
          <div class="quick-amounts">
            <button type="button" class="quick-amt" data-value="100">100</button>
            <button type="button" class="quick-amt" data-value="500">500</button>
            <button type="button" class="quick-amt" data-value="1000">1 000</button>
            <button type="button" class="quick-amt" data-value="5000">5 000</button>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Описание</label>
          <input type="text" id="description" name="description" placeholder="Краткое описание">
        </div>

        <button type="submit" id="submitBtn">
          <span id="buttonText">Сохранить</span>
          <div id="spinner" class="spinner hidden"></div>
        </button>
      </form>
    </div>

    <!-- Сводка бюджета -->
    <div class="analytics-wrapper">
      <h2>Сводка бюджета</h2>

      <!-- Фильтр периода -->
      <div class="filter-bar">
        <label for="periodFilter">Период</label>
        <select id="periodFilter">
          <option value="current_month">Текущий месяц</option>
          <option value="last_month">Прошлый месяц</option>
          <option value="last_3">3 месяца</option>
          <option value="last_6">6 месяцев</option>
          <option value="year">Год</option>
        </select>
      </div>

      <!-- Карточки сводки -->
      <div class="summary-cards" id="summaryCards">
        <div class="summary-card income-card">
          <div class="summary-label">Доходы</div>
          <div class="summary-value" id="summaryIncome">—</div>
        </div>
        <div class="summary-card expense-card">
          <div class="summary-label">Расходы</div>
          <div class="summary-value" id="summaryExpenses">—</div>
        </div>
        <div class="summary-card balance-card">
          <div class="summary-label">Баланс</div>
          <div class="summary-value" id="summaryBalance">—</div>
        </div>
      </div>

      <!-- Графики -->
      <div class="charts-container">
        <div class="chart-box">
          <h3>Расходы по категориям</h3>
          <div class="chart-wrapper">
            <canvas id="categoryChart"></canvas>
          </div>
          <p class="chart-empty" id="categoryEmpty" style="display:none;">Нет данных за выбранный период</p>
        </div>

        <div class="chart-box">
          <h3>Динамика по месяцам</h3>
          <div class="chart-wrapper">
            <canvas id="monthlyChart"></canvas>
          </div>
          <p class="chart-empty" id="monthlyEmpty" style="display:none;">Нет данных за выбранный период</p>
        </div>
      </div>

      <!-- Последние операции -->
      <div class="transactions-section">
        <h3>Последние операции</h3>
        <div id="transactionsList" class="transactions-list">
          <p class="loading-text">Загрузка...</p>
        </div>
        <button type="button" id="showMoreBtn" class="show-more-btn hidden">Показать ещё</button>
      </div>
    </div>

  </div>

  <!-- Вне .form-wrapper: backdrop-filter ломает position:fixed у потомков -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>

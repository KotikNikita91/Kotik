<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Считаем деньгиииии</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="cat-icon.png">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">

    <!-- Основная форма -->
    <div class="form-wrapper">
      <h1>Считаем деньгиииии</h1>

      <div class="city-toggle" aria-label="Город">
        <div class="city-toggle__label">Город</div>
        <button type="button" id="cityMskBtn" class="city-pill" aria-pressed="false" title="Помечать операции как Мск">
          Мск
        </button>
        <div class="city-toggle__hint" id="cityHint">по умолчанию — без города</div>
      </div>

      <form id="budgetForm">
        <div class="form-group">
          <label for="date">Дата:</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
          <label for="category">Категория:</label>
          <select id="category" name="category" required>
            <option value="">Выберите категорию</option>
            <option value="🛒 Продукты">🛒 Продукты</option>
            <option value="🏥 Здоровье">🏥 Здоровье</option>
            <option value="🏠 Дом">🏠 Дом</option>
            <option value="🚗 Автомобиль">🚗 Автомобиль</option>
            <option value="🐱 Кот">🐱 Кот</option>
            <option value="📱 Связь">📱 Связь</option>
            <option value="👕 Одежда">👕 Одежда</option>
            <option value="🍽️ Кафе/Рестораны">🍽️ Кафе/Рестораны</option>
            <option value="🍱 Обед на работе">🍱 Обед на работе</option>
            <option value="🎮 Развлечения">🎮 Развлечения</option>
            <option value="💄 Косметика">💄 Косметика</option>
            <option value="💡 Коммуналка">💡 Коммуналка</option>
            <option value="🏡 Ипотека">🏡 Ипотека</option>
            <option value="🛏 Аренда">🛏 Аренда</option>
            <option value="🚕 Такси/Общ. транспорт">🚕 Такси/Общ. транспорт</option>
            <option value="✈️ Авиа / ЖД билеты">✈️ Авиа / ЖД билеты</option>
            <option value="🌎 Отпуск">🌎 Отпуск</option>
            <option value="❗ Непредвиденное">❗ Непредвиденное</option>
            <option value="🥊🏈⚽️ Спорт">🥊🏈⚽️ Спорт</option>
            <option value="💰 Доход">💰 Доход</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sum">Сумма:</label>
          <input type="number" id="sum" name="sum" placeholder="Введите сумму" required>
        </div>

        <div class="form-group">
          <label for="description">Описание:</label>
          <input type="text" id="description" name="description" placeholder="Краткое описание">
        </div>

        <div class="form-group">
          <label for="type">Тип операции:</label>
          <select id="type" name="type" required>
            <option value="Расход">Расход</option>
            <option value="Доход">Доход</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">
          <span id="buttonText">Сохранить</span>
          <div id="spinner" class="spinner hidden"></div>
        </button>
      </form>

      <div id="toast" class="toast hidden"></div>
    </div>

    <!-- Сводка бюджета -->
    <div class="analytics-wrapper">
      <h2>Сводка бюджета</h2>

      <!-- Фильтр периода -->
      <div class="filter-bar">
        <label for="periodFilter">Период:</label>
        <select id="periodFilter">
          <option value="current_month">Текущий месяц</option>
          <option value="last_month">Прошлый месяц</option>
          <option value="last_3">3 месяца</option>
          <option value="last_6">6 месяцев</option>
          <option value="year">Год</option>
        </select>
      </div>

      <!-- Карточки сводки -->
      <div class="summary-cards" id="summaryCards">
        <div class="summary-card income-card">
          <div class="summary-label">Доходы</div>
          <div class="summary-value" id="summaryIncome">—</div>
        </div>
        <div class="summary-card expense-card">
          <div class="summary-label">Расходы</div>
          <div class="summary-value" id="summaryExpenses">—</div>
        </div>
        <div class="summary-card balance-card">
          <div class="summary-label">Баланс</div>
          <div class="summary-value" id="summaryBalance">—</div>
        </div>
      </div>

      <!-- Графики -->
      <div class="charts-container">
        <div class="chart-box">
          <h3>Расходы по категориям</h3>
          <div class="chart-wrapper">
            <canvas id="categoryChart"></canvas>
          </div>
          <p class="chart-empty" id="categoryEmpty" style="display:none;">Нет данных за выбранный период</p>
        </div>

        <div class="chart-box">
          <h3>Динамика по месяцам</h3>
          <div class="chart-wrapper">
            <canvas id="monthlyChart"></canvas>
          </div>
          <p class="chart-empty" id="monthlyEmpty" style="display:none;">Нет данных за выбранный период</p>
        </div>
      </div>

      <!-- Последние операции -->
      <div class="transactions-section">
        <h3>Последние операции</h3>
        <div id="transactionsList" class="transactions-list">
          <p class="loading-text">Загрузка...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Chart.js обязательно до app.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
